description: "Long-term memory for Hermes. Capture conversations, recall useful facts across sessions and search your knowledge. Explicit tools use OpenViking MCP; new connections require approval for writes. Choose Quick Local, OpenViking Service (managed cloud) or your own server. MCP requires OpenViking >=0.4.23 with /mcp enabled and Hermes launch-time profile binding. MCP capture permits only reviewed OpenViking remember, write, edit and forget calls and acknowledgements; other MCP tools and deferred wrappers are excluded. Restart Hermes after upgrading. Disclosure — conversation turns, tool results and MEMORY.md / USER.md edits are sent to the configured OpenViking server. Quick Local setup installs the newest OpenViking 0.5.x server release from PyPI at setup time (checked against PyPI's hash, not the version reviewed here; re-running setup upgrades it) plus a hash-pinned llama-cpp-python wheel and a local embedding model. It copies the active Hermes static LLM API key into a private file under the profile for extraction, and its localhost server keeps running after Hermes exits and after plugin removal (stop it with `hermes openviking local stop`). Extraction can use a remote LLM. Custom localhost connections can start openviking-server from PATH with the profile environment minus Hermes bot, gateway, GitHub and dashboard secrets; model and tool API keys still pass."
